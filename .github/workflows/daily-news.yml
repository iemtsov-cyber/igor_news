name: News every 4 hours + GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'config.json'
      - 'sources.json'
      - 'editorial_policy.md'
      - 'prompts/**'
      - 'tests/**'
      - 'reviewed_editions/**'
      - 'requirements.txt'
      - '.github/workflows/daily-news.yml'
  workflow_dispatch:
  schedule:
    # Every 4 hours in Moscow, shifted away from minute 00 to avoid GitHub Actions peak load.
    - cron: "17 3,7,11,15,19,23 * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate v8.1
        run: |
          python -m py_compile news.py
          python -m py_compile news_v8.py
          python -m py_compile news_v81.py

      - name: Build incremental edition from free RSS
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python news_v81.py

      - name: Publish only explicitly reviewed editions (no API calls)
        run: python publish_reviewed.py

      - name: Refresh presentation preserving content timestamp
        run: python render_current.py

      - name: Save feed, archive and memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json
          if [ -d staging ]; then git add staging; fi
          if ! git diff --cached --quiet; then
            git commit -m "news: append four-hour RSS update"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
