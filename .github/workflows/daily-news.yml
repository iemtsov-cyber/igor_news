name: News every 4 hours + GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours. UTC schedule becomes 03:00, 07:00, 11:00, 15:00, 19:00, 23:00 Moscow time.
    - cron: "0 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select free Gemini model
        run: |
          python -c "from pathlib import Path; p=Path('config.json'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('gemini-2.5-flash-lite','gemini-3.1-flash-lite'), encoding='utf-8')"

      - name: Migrate collector to Gemini
        run: |
          python migrate_v7.py
          python -m py_compile news.py

      - name: Build incremental edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news.py

      - name: Save feed, archive and memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json news.py docs state.json
          if ! git diff --cached --quiet; then
            git commit -m "news: append four-hour update"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
